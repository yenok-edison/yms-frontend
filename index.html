        <h2 style="color:#fcb900;">Registrations Closed</h2>

        <p class="subtitle" style="font-size:18px; line-height:1.8; margin-top:20px;">
          Registrations for <strong>Teens Rock 2026</strong> have now closed.
        </p>

        <p class="subtitle" style="font-size:17px; line-height:1.8;">
          A big thank you to all the bands, schools, teachers, and participants
          who showed interest and submitted their entries.
        </p>

        <p class="subtitle" style="font-size:17px; line-height:1.8;">
          We look forward to an exciting competition and wish all participating
          bands the very best.
        </p>
      </div>
    </div>
  </div>
